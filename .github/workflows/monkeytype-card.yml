name: monkeytype card

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  push:
    branches: [main]
    paths:
      - "scripts/monkeytype-card.mjs"
      - ".github/workflows/monkeytype-card.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monkeytype-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Generate card
        run: node scripts/monkeytype-card.mjs HiL1ne

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/monkeytype.svg; then
            echo "No change in personal bests — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/monkeytype.svg
          git commit -m "chore: refresh monkeytype card"
          git push
